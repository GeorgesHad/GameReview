openapi: 3.1.0
info:
  title: Football Match Review API
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check Worker liveness and deployment identity
      description: Public liveness probe. It makes no calls to Supabase or R2.
      responses:
        '200':
          description: The Worker is responding.
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          description: The request could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Health:
      type: object
      required: [status, environment, version, revision]
      properties:
        status:
          type: string
          const: ok
        environment:
          type: string
          enum: [local, dev, prod]
        version:
          type: [string, 'null']
          minLength: 1
          description: Cloudflare Worker version ID, or null during emulation.
        revision:
          type: [string, 'null']
          minLength: 1
          description: Git commit SHA supplied as the deploy version tag, or null when untagged.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
              format: uuid
