name: Apply Supabase migrations

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply pending migrations after reviewing the plan
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: database-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.4.0
      - name: Preview migrations for the selected branch
        env:
          DATABASE_URL: ${{ secrets[format('SUPABASE_{0}_DB_URL', github.ref_name == 'develop' && 'DEV' || 'PROD')] }}
        run: |
          : "${DATABASE_URL:?Missing Supabase session-pooler connection string}"
          supabase db push --remote="$DATABASE_URL" --skip-vault --dry-run
      - name: Apply and verify migration history
        if: inputs.apply
        env:
          DATABASE_URL: ${{ secrets[format('SUPABASE_{0}_DB_URL', github.ref_name == 'develop' && 'DEV' || 'PROD')] }}
        run: |
          supabase db push --remote="$DATABASE_URL" --skip-vault --yes
          supabase migration list --remote="$DATABASE_URL"
